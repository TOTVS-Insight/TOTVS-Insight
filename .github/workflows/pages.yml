# Publica o site no GitHub Pages a cada push na main.
# Você só precisa: git add / commit / push.
#
# Configuração única no GitHub:
#   Settings → Pages → Source: GitHub Actions
#
# O índice público (`public/data/meetings-index.json`) precisa estar no repo
# (sem pasta transcricoes/). Atualize o índice localmente com
# `pnpm data:build:publico` só quando a base de reuniões mudar.

name: GitHub Pages

# Sem gatilho automático: o repositório é privado, e o GitHub Pages exige
# repositório público ou plano Pro. Além disso a publicação passou a ser pela
# Vercel. Rode pela aba Actions se um dia o repositório virar público.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # `lfs: true` é obrigatório: o .gitattributes põe *.png, *.ttf e *.woff2
      # no Git LFS, e o checkout padrão traz só os ponteiros de 130 bytes. Sem
      # isto o Vite empacota o texto do ponteiro como se fosse imagem e fonte —
      # o site sobe sem a logo e sem a tipografia da marca, e sem erro nenhum,
      # porque o servidor devolve 200 com o content-type certo.
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Checar índice público
        run: |
          if [ ! -f public/data/meetings-index.json ]; then
            echo "::error::Falta public/data/meetings-index.json no repositório."
            echo "Rode localmente: pnpm data:build:publico"
            echo "Depois faça commit de public/data/meetings-index.json (sem transcricoes/)."
            exit 1
          fi
          if [ -d public/data/transcricoes ]; then
            echo "::error::public/data/transcricoes/ não pode ir pro Pages (dados de cliente)."
            exit 1
          fi

      # Rede de segurança para o caso de a cota de LFS estourar ou o `lfs: true`
      # sumir num refactor: um ponteiro passa batido pelo build inteiro.
      - name: Checar binários do LFS
        run: |
          faltando=0
          for f in $(git ls-files '*.png' '*.ttf' '*.woff2'); do
            if head -c 40 "$f" | grep -q "^version https://git-lfs"; then
              echo "::error::$f é um ponteiro LFS, não o arquivo real."
              faltando=1
            fi
          done
          if [ "$faltando" = "1" ]; then
            echo "Rode o checkout com 'lfs: true' ou verifique a cota de LFS do repositório."
            exit 1
          fi
          echo "✓ binários íntegros"

      - name: Build
        run: pnpm build:pages

      # O Pages nunca leva `transcricoes/` — é dado de cliente e está no
      # .gitignore. Mas o índice versionado costuma vir de um `pnpm data:build`
      # local, que o marca `transcricoesDisponiveis: true`. Sem esta correção o
      # drawer tenta buscar o texto, toma 404 e mostra erro em vez do aviso de
      # "não publicado". Normalizar aqui é o que impede a regressão de voltar.
      - name: Marcar transcrições como indisponíveis
        run: |
          node -e '
            const fs = require("node:fs");
            const arquivo = "dist/data/meetings-index.json";
            const indice = JSON.parse(fs.readFileSync(arquivo, "utf8"));
            if (indice.transcricoesDisponiveis === false) {
              console.log("• índice já marcado como sem transcrições");
            } else {
              indice.transcricoesDisponiveis = false;
              fs.writeFileSync(arquivo, JSON.stringify(indice));
              console.log("✓ transcricoesDisponiveis ajustado para false");
            }
          '
          if [ -d dist/data/transcricoes ]; then
            echo "::error::dist/data/transcricoes/ existe — abortando o deploy."
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
